<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場写真調書（4枚仕様）- EXIF位置情報最適化版</title>

  <!-- EXIF解析ライブラリ（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="写真調書4枚">

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "MS Gothic", sans-serif; color: #000; }
    body { margin: 0; padding: 15px; background: #f0f2f5; color: #000; }
    
    /* 操作メニューバー */
    .controls {
      position: sticky; top: 0; z-index: 1000; background: #fff;
      padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap;
    }
    button {
      padding: 9px 14px; border: none; border-radius: 6px; background: #007aff;
      color: white !important; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    button.predefined { background: #009688; color: white !important; }
    button.csv { background: #ff9500; color: white !important; }
    button.save { background: #34c759; color: white !important; }
    button.export { background: #5856d6; color: white !important; }
    button.import { background: #5ac8fa; color: white !important; }
    button.danger { background: #ff3b30; color: white !important; }

    /* A4画面プレビュー設定 (上下20mm・左右30mm余白) */
    .a4-page {
      width: 210mm; min-height: 297mm; padding: 20mm 30mm; margin: 0 auto 20px auto;
      background: white; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      box-sizing: border-box; display: flex; flex-direction: column; position: relative;
    }

    /* ページヘッダー */
    .page-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      border-bottom: 2px solid #000; padding-bottom: 3px; margin-bottom: 4mm;
    }
    .page-title { font-size: 20px; font-weight: bold; color: #000; }
    .header-right { display: flex; align-items: flex-end; gap: 6px; font-weight: bold; color: #000; }
    .header-right .point-container { display: flex; flex-direction: column; gap: 2px; }
    .header-right input {
      font-size: 14px; padding: 3px 6px; border: 1px solid #ccc; border-radius: 4px; width: 180px;
      color: #000 !important; background: #fff;
    }

    /* 2列×2行 グリッド配置 */
    .photo-grid {
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      gap: 4mm; flex-grow: 1;
    }

    /* 4枚カードスタイル (高さ110mm) */
    .photo-card {
      border: 1px solid #666; border-radius: 4px; padding: 5px; background: #fafafa;
      display: flex; flex-direction: column; height: 110mm;
    }
    
    /* 写真枠 */
    .image-box {
      width: 100%; flex: 1; border: 1px dashed #ccc; background: #eee;
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .image-box img {
      max-width: 100%; max-height: 100%; width: auto; height: auto;
      object-fit: contain; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); margin: 0;
    }

    /* 撮影・選択ボタンエリア */
    .placeholder-btn-group {
      display: flex; gap: 8px; justify-content: center; align-items: center;
      z-index: 10; width: 90%;
    }
    .photo-btn {
      flex: 1; padding: 8px 4px; background: #007aff; color: #fff !important;
      font-size: 11px; font-weight: bold; border-radius: 4px; text-align: center;
      cursor: pointer; position: relative; overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15); display: inline-block;
      user-select: none; -webkit-user-select: none;
    }
    .photo-btn.gal-btn { background: #34c759; }
    .photo-btn input[type="file"] {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    /* 写真削除ボタン */
    .img-remove-btn {
      position: absolute; top: 6px; right: 6px; z-index: 20;
      background: rgba(255, 59, 48, 0.88); color: #fff !important;
      border: none; border-radius: 4px; padding: 4px 8px; font-size: 10px;
      font-weight: bold; cursor: pointer;
    }

    /* コメント入力ボックス */
    .comment-box { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
    
    .data-select {
      width: 100%; font-size: 10px; padding: 1px 3px; border: 1px solid #007aff; border-radius: 2px;
      color: #007aff !important; background-color: #f0f7ff;
      -webkit-appearance: none; appearance: none;
    }

    .comment-box input, .comment-box textarea {
      width: 100%; font-size: 11px; padding: 2px 3px; border: 1px solid #ccc; border-radius: 3px;
      color: #000 !important; background-color: #fff;
      -webkit-appearance: none; appearance: none; text-align: left !important;
    }

    textarea.data-input {
      resize: none; rows: 2; line-height: 1.2; font-family: inherit; height: 2.8em;
    }

    /* 調査日（日付入力） */
    input[type="date"].data-input {
      text-align: left !important; justify-content: flex-start !important;
      display: flex !important; align-items: center !important;
    }
    input[type="date"]::-webkit-date-and-time-value {
      text-align: left !important;
    }

    /* モーダルポップアップ */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 2000; display: none;
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: #fff; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px;
      display: flex; flex-direction: column; gap: 12px; max-height: 80vh; overflow-y: auto;
    }
    .project-list {
      display: flex; flex-direction: column; gap: 8px; margin-top: 10px;
    }
    .project-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #f9f9f9;
    }

    /* Chrome 印刷規格設定 */
    @page {
      size: A4 portrait;
      margin: 20mm 30mm;
    }
    @media print {
      html, body { margin: 0 !important; padding: 0 !important; background: white !important; width: 100% !important; height: auto !important; }
      .controls, .delete-page-btn, .modal-overlay, .data-select, .placeholder-btn-group, .img-remove-btn { display: none !important; }
      #pages-container { width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .a4-page {
        width: 100% !important; height: auto !important; min-height: 0 !important; margin: 0 !important; border: none !important;
        box-shadow: none !important; padding: 0 !important; box-sizing: border-box !important; page-break-inside: avoid !important; break-inside: avoid !important;
      }
      .a4-page:not(:last-child) { page-break-after: always !important; break-after: page !important; }
      .image-box { border: 1px solid #000; background: #fff; }
      input, textarea {
        border: 1px solid #000 !important; color: #000 !important; background: transparent !important;
        -webkit-appearance: none; appearance: none; text-align: left !important; resize: none;
      }
      input[type="date"]::-webkit-date-and-time-value { text-align: left !important; }
    }
  </style>
</head>
<body>

  <!-- 操作メニューバー -->
  <div class="controls">
    <button onclick="addPage(); scheduleAutoSave();">＋ ページ追加</button>
    <button class="predefined" onclick="document.getElementById('predefinedFileInput').click()">定義済みファイル読込</button>
    <button class="csv" onclick="document.getElementById('csvFileInput').click()">CSV選択肢読込</button>
    <button class="save" onclick="showProjectModal()">アプリ内保存/切替</button>
    <button class="export" onclick="exportProjectFile()">「ファイル」へ書き出し</button>
    <button class="import" onclick="document.getElementById('importFileInput').click()">「ファイル」から復元</button>
    <button onclick="window.print()">A4 PDF出力 / 印刷</button>
    
    <!-- Android/iOS両対応ファイル入力群 -->
    <input type="file" id="predefinedFileInput" accept=".csv, text/csv, text/plain, text/comma-separated-values, application/vnd.ms-excel, application/csv, */*" style="position:fixed; top:-9999px; left:-9999px; opacity:0;" onchange="loadPredefinedReport4Cards(this)">
    <input type="file" id="csvFileInput" accept=".csv, text/csv, text/plain, text/comma-separated-values, application/vnd.ms-excel, application/csv, */*" style="position:fixed; top:-9999px; left:-9999px; opacity:0;" onchange="loadCategoriesFromCsv(this)">
    <input type="file" id="importFileInput" accept=".json, application/json, text/plain, */*" style="position:fixed; top:-9999px; left:-9999px; opacity:0;" onchange="importProjectFile(this)">
  </div>

  <div id="pages-container"></div>

  <!-- アプリ内プロジェクト管理モーダル -->
  <div id="projectModal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="margin:0;">アプリ内プロジェクト管理</h3>
      <div>
        <label style="font-size:12px; font-weight:bold;">現在の画面内容を名前をつけて保存:</label>
        <div style="display:flex; gap:6px; margin-top:4px;">
          <input type="text" id="newProjectNameInput" placeholder="例: 現場A_写真調書" style="flex:1; padding:6px; border:1px solid #ccc; border-radius:4px;">
          <button class="save" onclick="saveCurrentProjectNamed()">保存</button>
        </div>
      </div>
      <hr style="width:100%; border:none; border-top:1px solid #eee; margin:5px 0;">
      <div>
        <label style="font-size:12px; font-weight:bold;">保存済みプロジェクト一覧:</label>
        <div id="projectListContainer" class="project-list"></div>
      </div>
      <div style="text-align:right; margin-top:10px;">
        <button class="danger" onclick="closeProjectModal()">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    let CATEGORIES_TOP = [
      "平-沢6", "平串TN-沢11", "平串TN-沢2-1", "平串TN-沢4",
      "平串TN-重金属10", "平串TN-重金属11", "平串TN-重金属12’", "平串TN-重金属13"
    ];
    let CATEGORIES_MID = [
      "水質分析（現場簡易PH測定）", "定期観測（容器法）", "定期観測（流速計測法）",
      "水位観測（手手動水位計観測）", "水位観測（自記水位計観測）", "現場簡易水質測定", "採水"
    ];
    let CATEGORIES_POINT = [
      "R6-IW-No.1", "R6-IW-No.2", "平-沢6", "平串TN-沢11"
    ];
    let CATEGORIES_REMARK = [
      "PH=\nEC= mS/m\n水温= 度\n濁度= 度",
      "流量= L/min\nPH=\nEC= mS/m\n水温= 度\n濁度= 度",
      "全景", "近景", "作業状況", "完了状況"
    ];

    let pageCount = 0;
    let autoSaveTimer = null;
    let preCapturedGps = "";

    function getTodayString() {
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function scheduleAutoSave() {
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        saveAutoDraft();
      }, 500);
    }

    function copySelectToInput(selectEl) {
      const targetInput = selectEl.nextElementSibling;
      if (targetInput) {
        if (selectEl.value === "__CLEAR__") {
          targetInput.value = "";
          targetInput.focus();
        } else if (selectEl.value !== "") {
          targetInput.value = selectEl.value;
        }
      }
      scheduleAutoSave();
    }

    /* 💡 バックグラウンド現在地監視（カメラ撮影時用） */
    function startContinuousGpsWatch() {
      if (!navigator.geolocation) return;
      navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lon = pos.coords.longitude.toFixed(6);
          preCapturedGps = `${lat}, ${lon}`;
        },
        (err) => { console.warn("Watch GPS Notice:", err); },
        { enableHighAccuracy: false, timeout: 20000, maximumAge: 600000 }
      );
    }

    function addPage() {
      pageCount++;
      const container = document.getElementById('pages-container');
      const pageDiv = document.createElement('div');
      pageDiv.className = 'a4-page';
      pageDiv.id = `page-${pageCount}`;

      let cardsHtml = '';
      const todayStr = getTodayString();

      for (let i = 1; i <= 4; i++) {
        // 💡 撮影ボタンは true、選択ボタンは false を渡す
        cardsHtml += `
          <div class="photo-card">
            <div class="image-box">
              <div class="placeholder-btn-group">
                <label class="photo-btn cam-btn">
                  📷 撮影
                  <input type="file" accept="image/*" capture="environment" onchange="previewImage(this, 'img-${pageCount}-${i}', true)">
                </label>
                <label class="photo-btn gal-btn">
                  🖼️ 選択
                  <input type="file" accept="image/*" onchange="previewImage(this, 'img-${pageCount}-${i}', false)">
                </label>
              </div>
              <img id="img-${pageCount}-${i}" style="display:none;">
              <button type="button" class="img-remove-btn" onclick="clearImage('img-${pageCount}-${i}', this)" style="display:none;">✕ 削除</button>
            </div>
            <div class="comment-box">
              <select class="data-select select-top" onchange="copySelectToInput(this)">
                <option value="">▼ 【上段】選択</option>
                <option value="__CLEAR__">✏️ その他（自由記入）</option>
                ${CATEGORIES_TOP.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
              </select>
              <input type="text" class="data-input val-top" placeholder="【上段】（直接入力・編集可）">

              <select class="data-select select-mid" onchange="copySelectToInput(this)">
                <option value="">▼ 【中段】選択</option>
                <option value="__CLEAR__">✏ その他（自由記入）</option>
                ${CATEGORIES_MID.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
              </select>
              <input type="text" class="data-input val-mid" placeholder="【中段】（直接入力・編集可）">

              <select class="data-select select-remark" onchange="copySelectToInput(this)">
                <option value="">▼ 【下段】選択</option>
                <option value="__CLEAR__">✏️ その他（自由記入）</option>
                ${CATEGORIES_REMARK.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
              </select>
              <textarea class="data-input val-remark" rows="2" placeholder="【下段】備考（直接入力・編集可）"></textarea>
              
              <!-- 💡 内部用 隠し位置情報枠 -->
              <input type="hidden" class="val-gps" value="">
              <input type="date" class="data-input val-date" value="${todayStr}">
            </div>
          </div>
        `;
      }

      pageDiv.innerHTML = `
        <div class="page-header">
          <div class="page-title">現場写真調書</div>
          <div class="header-right">
            <span>地点名:</span>
            <div class="point-container">
              <select class="data-select select-point" onchange="copySelectToInput(this)">
                <option value="">▼ 地点名選択</option>
                <option value="__CLEAR__">✏️ その他（自由記入）</option>
                ${CATEGORIES_POINT.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
              </select>
              <input type="text" class="data-input boring-point" placeholder="例: R6-IW-No.1">
            </div>
            <button class="danger delete-page-btn" onclick="this.closest('.a4-page').remove(); scheduleAutoSave();" style="margin-left:4px; padding:3px 8px;">削除</button>
          </div>
        </div>
        <div class="photo-grid">${cardsHtml}</div>
      `;

      container.appendChild(pageDiv);
      return pageDiv;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function parseStrictCSV(text) {
      const result = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const nextC = text[i + 1];

        if (c === '"') {
          if (inQuotes && nextC === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push(cell.trim());
          cell = '';
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && nextC === '\n') {
            i++;
          }
          row.push(cell.trim());
          if (row.some(f => f !== '')) {
            result.push(row);
          }
          row = [];
          cell = '';
        } else {
          cell += c;
        }
      }
      if (cell !== '' || row.length > 0) {
        row.push(cell.trim());
        if (row.some(f => f !== '')) {
          result.push(row);
        }
      }
      return result;
    }

    function readFileAsArrayBufferSafe(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error("ファイルの読み込みに失敗しました"));
        reader.readAsArrayBuffer(file);
      });
    }

    async function loadPredefinedReport4Cards(inputEl) {
      if (!inputEl.files || !inputEl.files[0]) return;
      const file = inputEl.files[0];

      let buffer;
      try {
        buffer = await readFileAsArrayBufferSafe(file);
      } catch (err) {
        alert("ファイルの読み込みに失敗しました: " + err.message);
        inputEl.value = '';
        return;
      }

      const currentCards = document.querySelectorAll('.photo-card');
      const hasInputs = Array.from(currentCards).some(card => {
        return card.querySelector('.val-top').value || card.querySelector('.val-mid').value || (card.querySelector('img').style.display !== 'none');
      });

      if (hasInputs) {
        if (!confirm("定義済みファイルを読み込むと、現在の画面内容は上書きされます。\n読み込みを実行しますか？")) {
          inputEl.value = '';
          return;
        }
      }

      try {
        let text = new TextDecoder('utf-8').decode(buffer);
        if (text.includes('\uFFFD')) {
          text = new TextDecoder('shift-jis').decode(buffer);
        }

        const rows = parseStrictCSV(text);
        if (rows.length === 0) {
          alert('CSVファイルが空か、正しい形式ではありません。');
          return;
        }

        const validRows = [];
        rows.forEach((cols, idx) => {
          if (idx === 0) {
            const headerStr = cols.join(' ');
            if (headerStr.includes('地点名') || headerStr.includes('上段') || headerStr.includes('中段') || headerStr.includes('下段') || headerStr.includes('調査日')) {
              return; // ヘッダー行スキップ
            }
          }
          if (cols.some(c => c.trim() !== '')) {
            validRows.push(cols);
          }
        });

        if (validRows.length === 0) {
          alert('有効な調書データが見つかりませんでした。');
          return;
        }

        document.getElementById('pages-container').innerHTML = '';
        pageCount = 0;
        const todayStr = getTodayString();

        let currentPageDiv = null;
        let currentCardsArray = [];
        let currentCardIndex = 0;
        let previousPointName = null;

        for (let i = 0; i < validRows.length; i++) {
          const row = validRows[i];
          const pointVal = row[0] ? row[0].trim() : '';
          const topVal = row[1] ? row[1].trim() : '';
          const midVal = row[2] ? row[2].trim() : '';
          const remarkVal = row[3] ? row[3].trim() : '';
          let dateVal = row[4] ? row[4].trim() : '';

          if (dateVal) {
            dateVal = dateVal.replace(/\//g, '-');
            const parts = dateVal.split('-');
            if (parts.length === 3) {
              dateVal = `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
            }
          } else {
            dateVal = todayStr;
          }

          if (currentPageDiv === null || pointVal !== previousPointName || currentCardIndex >= 4) {
            currentPageDiv = addPage();
            currentPageDiv.querySelector('.boring-point').value = pointVal;
            currentCardsArray = currentPageDiv.querySelectorAll('.photo-card');
            currentCardIndex = 0;
            previousPointName = pointVal;
          }

          const card = currentCardsArray[currentCardIndex];
          card.querySelector('.val-top').value = topVal;
          card.querySelector('.val-mid').value = midVal;
          card.querySelector('.val-remark').value = remarkVal;
          card.querySelector('.val-date').value = dateVal;

          currentCardIndex++;
        }

        updateAllSelectOptions();
        scheduleAutoSave();

        alert(`定義済みファイルから ${validRows.length}件 の調書データを作成しました！\n（地点名ごとに自動でページが分割されています）`);
      } catch (err) {
        alert('定義済みファイルの解析に失敗しました: ' + err.message);
      } finally {
        inputEl.value = '';
      }
    }

    async function loadCategoriesFromCsv(inputEl) {
      if (!inputEl.files || !inputEl.files[0]) return;
      const file = inputEl.files[0];

      try {
        const buffer = await readFileAsArrayBufferSafe(file);
        let text = new TextDecoder('utf-8').decode(buffer);
        if (text.includes('\uFFFD')) {
          text = new TextDecoder('shift-jis').decode(buffer);
        }

        const rows = parseStrictCSV(text);
        const newTop = [];
        const newMid = [];
        const newPoint = [];
        const newRemarks = [];

        rows.forEach((cols, idx) => {
          if (idx === 0) {
            const headerStr = cols.join(' ');
            if (headerStr.includes('上段') || headerStr.includes('中段') || headerStr.includes('地点') || headerStr.includes('下段') ||
                headerStr.includes('大項目') || headerStr.includes('項目') || headerStr.includes('備考')) {
              return;
            }
          }

          if (cols.length > 0 && cols[0] && cols[0] !== '') {
            const val = cols[0].trim();
            if (val && !newTop.includes(val)) newTop.push(val);
          }
          if (cols.length > 1 && cols[1] && cols[1] !== '') {
            const val = cols[1].trim();
            if (val && !newMid.includes(val)) newMid.push(val);
          }
          if (cols.length > 2 && cols[2] && cols[2] !== '') {
            const val = cols[2].trim();
            if (val && !newPoint.includes(val)) newPoint.push(val);
          }
          if (cols.length > 3 && cols[3] && cols[3] !== '') {
            const val = cols[3].trim();
            if (val && !newRemarks.includes(val)) newRemarks.push(val);
          }
        });

        if (newTop.length === 0 && newMid.length === 0 && newPoint.length === 0 && newRemarks.length === 0) {
          alert('有効な選択肢データが見つかりませんでした。');
          return;
        }

        CATEGORIES_TOP = newTop;
        CATEGORIES_MID = newMid;
        CATEGORIES_POINT = newPoint;
        if (newRemarks.length > 0) CATEGORIES_REMARK = newRemarks;

        updateAllSelectOptions();
        await saveMasterCategories();
        scheduleAutoSave();

        alert(`CSVから選択肢を読み込みました！\n・【上段】: ${newTop.length}件\n・【中段】: ${newMid.length}件\n・【地点名】: ${newPoint.length}件\n・【下段】: ${newRemarks.length}件`);
      } catch (err) {
        alert('CSVファイルの読み込みに失敗しました: ' + err.message);
      } finally {
        inputEl.value = '';
      }
    }

    function convertDMSToDD(dms, ref) {
      if (!dms || dms.length < 3) return null;
      let dd = dms[0].numerator / dms[0].denominator +
               (dms[1].numerator / dms[1].denominator) / 60 +
               (dms[2].numerator / dms[2].denominator) / 3600;
      if (ref === "S" || ref === "W") dd = dd * -1;
      return dd.toFixed(6);
    }

    /* 💡 内部位置情報の更新処理 */
    function setGpsToCard(card, gpsStr) {
      if (!card) return;
      const gpsInput = card.querySelector('.val-gps');
      if (gpsInput) {
        gpsInput.value = gpsStr;
      }
      scheduleAutoSave();
    }

    /* 💡 バックグラウンド現在地測位（📷 撮影時のみ使用） */
    function fetchGpsSilently(card) {
      if (preCapturedGps) {
        setGpsToCard(card, preCapturedGps);
        return;
      }
      if (!navigator.geolocation) return;

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lon = pos.coords.longitude.toFixed(6);
          preCapturedGps = `${lat}, ${lon}`;
          setGpsToCard(card, preCapturedGps);
        },
        (err) => { console.warn("GPS silent get failed:", err); },
        { enableHighAccuracy: false, timeout: 6000, maximumAge: 300000 }
      );
    }

    /* 💡 画像処理（1600px/85%）＆ isCamera による位置情報処理の分岐 */
    function previewImage(input, targetId, isCamera) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const card = input.closest('.photo-card');
        const reader = new FileReader();

        // 💡 カメラかライブラリかで現在地取得の可否を分岐
        if (isCamera) {
          // 「📷撮影」の場合：現在地を取得して保存する
          setTimeout(() => {
            if (card) fetchGpsSilently(card);
          }, 1000);
        } else {
          // 「🖼️選択（ライブラリ）」の場合：現在地は取得せず、過去の内部GPSをクリア（EXIF抽出のみを待つ）
          if (card) {
            const hiddenGps = card.querySelector('.val-gps');
            if (hiddenGps) hiddenGps.value = '';
          }
        }

        reader.onload = function(e) {
          const imgObj = new Image();
          imgObj.onload = function() {
            const canvas = document.createElement('canvas');
            const maxDim = 1600;
            let width = imgObj.width;
            let height = imgObj.height;

            if (width > height) {
              if (width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              }
            } else {
              if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(imgObj, 0, 0, width, height);

            canvas.toBlob((blob) => {
              const targetImg = document.getElementById(targetId);
              if (targetImg._blobUrl) URL.revokeObjectURL(targetImg._blobUrl);
              targetImg._blob = blob;
              targetImg._blobUrl = URL.createObjectURL(blob);
              targetImg.src = targetImg._blobUrl;
              targetImg.style.display = 'block';

              const imageBox = input.closest('.image-box');
              if (imageBox) {
                const btnGroup = imageBox.querySelector('.placeholder-btn-group');
                if (btnGroup) btnGroup.style.display = 'none';
                const removeBtn = imageBox.querySelector('.img-remove-btn');
                if (removeBtn) removeBtn.style.display = 'block';
              }

              // 🔍 EXIF解析（写真データ内の日時・GPSを内部保持）
              if (typeof EXIF !== 'undefined') {
                try {
                  EXIF.getData(file, function() {
                    const now = new Date();
                    const nowFormattedDate = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

                    // 撮影日時の抽出
                    const exifDate = EXIF.getTag(this, "DateTimeOriginal");
                    if (exifDate) {
                      const parts = exifDate.split(" ");
                      if (parts.length >= 2) {
                        const dateParts = parts[0].split(":");
                        if (dateParts.length === 3 && card) {
                          const dateInput = card.querySelector('.val-date');
                          if (dateInput) dateInput.value = `${dateParts[0]}-${dateParts[1]}-${dateParts[2]}`;
                        }
                      }
                    } else {
                      if (card) {
                        const dateInput = card.querySelector('.val-date');
                        if (dateInput) dateInput.value = nowFormattedDate;
                      }
                    }

                    // 💡 EXIF内部のGPS位置情報抽出（ライブラリ選択時はこのデータのみが保存される）
                    const lat = EXIF.getTag(this, "GPSLatitude");
                    const latRef = EXIF.getTag(this, "GPSLatitudeRef") || "N";
                    const lon = EXIF.getTag(this, "GPSLongitude");
                    const lonRef = EXIF.getTag(this, "GPSLongitudeRef") || "E";

                    if (lat && lon) {
                      const latDD = convertDMSToDD(lat, latRef);
                      const lonDD = convertDMSToDD(lon, lonRef);
                      if (latDD && lonDD) {
                        setGpsToCard(card, `${latDD}, ${lonDD}`);
                      }
                    }
                  });
                } catch(err) {
                  console.warn("EXIF read error:", err);
                }
              }

              scheduleAutoSave();
            }, 'image/jpeg', 0.85);
          };
          imgObj.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    const DB_NAME = 'SitePhotoReportDB_4Cards_v16';
    const STORE_PROJECTS = 'projects';
    const STORE_MASTERS = 'masters';

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_PROJECTS)) {
            db.createObjectStore(STORE_PROJECTS, { keyPath: 'name' });
          }
          if (!db.objectStoreNames.contains(STORE_MASTERS)) {
            db.createObjectStore(STORE_MASTERS);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    function collectAppData() {
      const data = [];
      document.querySelectorAll('.a4-page').forEach(page => {
        const pageData = {
          point: page.querySelector('.boring-point').value,
          photos: []
        };
        page.querySelectorAll('.photo-card').forEach(card => {
          const img = card.querySelector('img');
          pageData.photos.push({
            top: card.querySelector('.val-top').value,
            mid: card.querySelector('.val-mid').value,
            remark: card.querySelector('.val-remark').value,
            gps: card.querySelector('.val-gps').value || '',
            date: card.querySelector('.val-date').value,
            blob: (img.style.display !== 'none' && img._blob) ? img._blob : null
          });
        });
        data.push(pageData);
      });
      return data;
    }

    function blobToDataURL(blob) {
      return new Promise((resolve) => {
        if (!blob) return resolve('');
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    }

    function dataURLtoBlob(dataurl) {
      if (!dataurl) return null;
      const arr = dataurl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while(n--) { u8arr[n] = bstr.charCodeAt(n); }
      return new Blob([u8arr], {type:mime});
    }

    async function exportProjectFile() {
      const projName = prompt("「ファイル」アプリに書き出すプロジェクト名を入力してください:", "現場写真調書データ");
      if (!projName || !projName.trim()) return;

      const pages = document.querySelectorAll('.a4-page');

      const exportPages = [];
      for (const page of pages) {
        const pageData = {
          point: page.querySelector('.boring-point').value,
          photos: []
        };
        const cards = page.querySelectorAll('.photo-card');
        for (const card of cards) {
          const img = card.querySelector('img');
          let dataUrl = '';
          if (img.style.display !== 'none' && img._blob) {
            dataUrl = await blobToDataURL(img._blob);
          }
          pageData.photos.push({
            top: card.querySelector('.val-top').value,
            mid: card.querySelector('.val-mid').value,
            remark: card.querySelector('.val-remark').value,
            gps: card.querySelector('.val-gps').value || '',
            date: card.querySelector('.val-date').value,
            dataUrl: dataUrl
          });
        }
        exportPages.push(pageData);
      }

      const exportObj = {
        version: "1.0",
        projectName: projName,
        createdAt: new Date().toISOString(),
        categoriesTop: CATEGORIES_TOP,
        categoriesMid: CATEGORIES_MID,
        categoriesPoint: CATEGORIES_POINT,
        categoriesRemark: CATEGORIES_REMARK,
        pages: exportPages
      };

      const jsonStr = JSON.stringify(exportObj);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement("a");
      a.href = url;
      a.download = `${projName.trim()}_${getTodayString()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

      const file = inputEl.files[0];

        const buffer = await readFileAsArrayBufferSafe(file);
        const text = new TextDecoder('utf-8').decode(buffer);
        const importObj = JSON.parse(text);

        if (!importObj.pages) {
          alert("正しくないプロジェクトファイル形式です。");

    function renderFromImportData(pagesData) {
      document.getElementById('pages-container').innerHTML = '';
      pageCount = 0;

      pagesData.forEach(pageData => {
        const pageDiv = addPage();
        if (pageData.point) pageDiv.querySelector('.boring-point').value = pageData.point;

        const cards = pageDiv.querySelectorAll('.photo-card');
        pageData.photos.forEach((pData, idx) => {
          if (cards[idx]) {
            const card = cards[idx];
            const img = card.querySelector('img');

            card.querySelector('.val-top').value = pData.top || '';
            card.querySelector('.val-mid').value = pData.mid || '';
            card.querySelector('.val-remark').value = pData.remark || '';
            card.querySelector('.val-gps').value = pData.gps || '';
            if (pData.date) card.querySelector('.val-date').value = pData.date;

            if (pData.dataUrl || pData.blob) {
              const blob = pData.blob ? pData.blob : dataURLtoBlob(pData.dataUrl);
              if (blob) {
                img._blob = blob;
                if (img._blobUrl) URL.revokeObjectURL(img._blobUrl);
                img._blobUrl = URL.createObjectURL(blob);
                img.src = img._blobUrl;
                img.style.display = 'block';

                const imageBox = card.querySelector('.image-box');

        });

          await renderProjectList();
        };
      } catch (e) {
        alert('削除エラー: ' + e.message);
      }
    }

    window.onload = async function() {
      startContinuousGpsWatch();

      try {
        await loadMasterCategories();
        const restored = await loadAutoDraft();
        if (!restored) {
          addPage();
        }
      } catch (err) {
        console.warn("Init fallback:", err);
        addPage();
      }

      const container = document.getElementById('pages-container');
      if (container) {
        container.addEventListener('input', scheduleAutoSave);
        container.addEventListener('change', scheduleAutoSave);
      }
    };
  </script>
</body>
</html>
